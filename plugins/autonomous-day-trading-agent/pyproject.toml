[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-day-trading-agent"
version = "0.1.0"
description = "Paper-first plugin scaffold for autonomous day-trading and investing agent workflows."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
research = ["pandas", "numpy", "yfinance", "ta", "backtesting"]
brokers = ["alpaca-py", "ib_async"]

[project.scripts]
autonomous-day-trading-agent = "autonomous_day_trading_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
