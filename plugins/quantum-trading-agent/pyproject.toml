[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-trading-agent"
version = "0.1.0"
description = "Safe starter plugin scaffold for quantum-assisted trading research and paper trading."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
quantum = ["qiskit", "qiskit-finance", "qiskit-optimization", "pennylane"]
research = ["pandas", "numpy", "scikit-learn", "matplotlib", "yfinance"]

[project.scripts]
quantum-trading-agent = "quantum_trading_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
