name: Deploy Interactive Command Center

# Cost policy: no recurring schedule. Pages redeploys only when the site or the
# data the site renders actually changes on main, or when the owner dispatches it.
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'design-options.html'
      - 'docs/catalog-status.json'
      - 'docs/catalog-status.svg'
      - 'docs/hardware-profiles.json'
      - 'repo-lists/public-allowlist.txt'
      - 'scripts/catalog_freshness_gate.py'
      - 'repo-lists/**'
      - 'scripts/catalog_guardian.py'
      - 'scripts/catalog_guardian_legacy.py'
      - 'scripts/catalog_security.py'
      - 'scripts/build_public_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Cost/robustness: refresh the metadata the visual renders, but never let a
      # rate-limited or failing API sweep break a deploy. On failure the committed
      # docs/catalog-status.json is served instead and the freshness gate annotates
      # how old it is, so the site degrades to "slightly stale" rather than "broken".
      - name: Refresh lightweight catalog metadata for the visual
        id: refresh
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: python scripts/catalog_guardian.py

      - name: Report catalog metadata freshness
        shell: bash
        run: |
          if [[ '${{ steps.refresh.outcome }}' != 'success' ]]; then
            echo '::warning::Catalog refresh failed; deploying the committed snapshot instead.'
          fi
          python scripts/catalog_freshness_gate.py

      - name: Check whether GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")"
          if [[ "$code" == '200' ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::warning::GitHub Pages is not enabled yet. One-time owner action: Settings → Pages → Source → GitHub Actions. This workflow will remain green and skip deployment until that is enabled.'
          fi

      - name: Stage privacy-safe public site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/docs
          cp docs/catalog-status.svg _site/docs/catalog-status.svg
          python scripts/build_public_site.py

      - name: Assert the public artifact leaks nothing private
        shell: bash
        run: python scripts/build_public_site.py --verify-only

      - name: Configure GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: needs.build.outputs.pages_enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
