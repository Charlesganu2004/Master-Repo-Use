name: Catalog Guardian

on:
  schedule:
    - cron: '23 7 * * 1'
  push:
    branches: [main]
    paths:
      - 'repo-lists/**'
      - 'scripts/catalog_guardian.py'
      - '.github/workflows/catalog-guardian.yml'
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: catalog-guardian-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  audit:
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Detect newly added catalog repositories
        id: additions
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/new-repos.txt
          if [[ '${{ github.event_name }}' == 'push' ]]; then
            base='${{ github.event.before }}'
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              base='HEAD^'
            fi
            git diff "$base" HEAD -- 'repo-lists/*.txt' \
              | sed -n 's/^+\([^+#][^ #]*\/[^ #]*\).*$/\1/p' \
              | sort -u > /tmp/new-repos.txt || true
          fi
          {
            echo 'repos<<EOF'
            cat /tmp/new-repos.txt
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Set up Go for new-repo security intake
        if: steps.additions.outputs.repos != ''
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install new-repo scan helpers
        if: steps.additions.outputs.repos != ''
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check semgrep
          go install github.com/gitleaks/gitleaks/v8@latest
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq
          sudo apt-get install -y -qq clamav
          if [[ -n "${SNYK_TOKEN:-}" ]]; then npm install -g snyk; fi

      - name: Refresh metadata and deep-scan new additions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r repo; do
            [[ -n "$repo" ]] && args+=(--force-repo "$repo")
          done < /tmp/new-repos.txt
          python scripts/catalog_guardian.py "${args[@]}"

      - name: Build audit issue body
        id: report
        shell: bash
        run: |
          python - <<'PY' > /tmp/catalog-audit.md
          import json
          from pathlib import Path
          data = json.loads(Path('docs/catalog-status.json').read_text(encoding='utf-8'))
          counts = data.get('counts', {})
          attention = [r for r in data.get('repos', []) if r.get('status') != 'HEALTHY']
          print('# Master Repo catalog audit')
          print()
          print(f"Generated: **{data.get('updated', 'unknown')}**")
          print()
          print(f"Healthy **{counts.get('HEALTHY', 0)}** · Stale **{counts.get('STALE', 0)}** · Review **{counts.get('REVIEW', 0)}** · Remove **{counts.get('REMOVE', 0)}**")
          print()
          print('This audit is generated by GitHub Actions and does **not** call GPT, Claude, Copilot, Codex, or any paid AI API.')
          print()
          if attention:
              print('| Repo | Status | Push age | Archived | Note |')
              print('|---|---|---:|---:|---|')
              for r in sorted(attention, key=lambda x: (x.get('status',''), x.get('repo',''))):
                  note = (r.get('note') or '').replace('|', '/').replace('\n', ' ')[:300]
                  age = f"{r.get('age_days')}d" if r.get('age_days') is not None else '—'
                  print(f"| `{r.get('repo')}` | **{r.get('status')}** | {age} | {'yes' if r.get('archived') else 'no'} | {note} |")
          else:
              print('No repository currently needs lifecycle/security attention.')
          print()
          print('## Owner approval gate')
          print()
          print('If you want the repository to perform the deeper deterministic security/lifecycle maintenance now, comment exactly:')
          print()
          print('`APPROVE CATALOG MAINTENANCE`')
          print()
          print('That approval runs a rotating deep scan plus all current REVIEW/REMOVE candidates, applies removal proposals on an automation branch, and opens a PR. **It never merges `main` automatically.**')
          print()
          print('Deep intake uses built-in invisible/prompt/SQL/command/secret/binary checks plus Semgrep, Gitleaks, OSV Scanner and ClamAV. Snyk runs when SNYK_TOKEN is configured. Additional supported scanners such as Trivy can also be installed without changing Guardian.')
          print()
          print('Policy: 120d stale warning · 270d replacement/managed-adoption review · 365d runtime removal threshold. Archived repos are reviewed for releases, sunset/EOL, successors, reference value, license, and security before removal.')
          PY
          attention="$(python - <<'PY'
          import json
          d=json.load(open('docs/catalog-status.json', encoding='utf-8'))
          print(sum(v for k,v in d.get('counts',{}).items() if k != 'HEALTHY'))
          PY
          )"
          echo "attention=$attention" >> "$GITHUB_OUTPUT"

      - name: Create or refresh owner audit issue
        if: steps.report.outputs.attention != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title [Catalog Audit]' --json number,title --jq '[.[] | select(.title | startswith("[Catalog Audit]"))][0].number // empty')"
          title='[Catalog Audit] Owner approval required'
          if [[ -n "$existing" ]]; then
            gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --title "$title" --body-file /tmp/catalog-audit.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file /tmp/catalog-audit.md --assignee Charlesganu2004
          fi

  approved-maintenance:
    if: >-
      github.event_name == 'issue_comment' &&
      github.actor == 'Charlesganu2004' &&
      github.event.issue.pull_request == null &&
      startsWith(github.event.issue.title, '[Catalog Audit]') &&
      contains(github.event.comment.body, 'APPROVE CATALOG MAINTENANCE')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install owner-approved scan helpers
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check semgrep
          go install github.com/gitleaks/gitleaks/v8@latest
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq
          sudo apt-get install -y -qq clamav
          if [[ -n "${SNYK_TOKEN:-}" ]]; then npm install -g snyk; fi

      - name: Run deep guardian and prepare lifecycle changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/catalog_guardian.py --deep --batch-size 12 --apply-removals

      - name: Create automation branch
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          branch='automation/catalog-guardian'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$branch"
          git add docs/ repo-lists/ managed-repos/
          git commit -m 'chore: propose owner-approved catalog maintenance'
          git push --force origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open or refresh owner-review PR
        if: steps.changes.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          branch='${{ steps.changes.outputs.branch }}'
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"
          body=$(cat <<'EOF'
          Owner-approved Catalog Guardian proposal.

          This PR can contain refreshed health/security state, lifecycle removals, replacement decisions, and managed-adoption candidate notes. The audit was generated by deterministic GitHub Actions tooling, not a paid AI background worker.

          Nothing in this PR should merge until @Charlesganu2004 reviews and approves it. CODEOWNERS and the Owner Approval Check provide the repository-side approval gate once branch protection/rules are enabled.
          EOF
          )
          if [[ -n "$existing" ]]; then
            gh pr edit "$existing" --repo "$GITHUB_REPOSITORY" --title 'chore: Catalog Guardian owner review' --body "$body"
            url="$(gh pr view "$existing" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
          else
            set +e
            url="$(gh pr create --repo "$GITHUB_REPOSITORY" --head "$branch" --base main --title 'chore: Catalog Guardian owner review' --body "$body" 2>/tmp/pr-error.txt)"
            rc=$?
            set -e
            if [[ $rc -ne 0 ]]; then
              gh issue comment '${{ github.event.issue.number }}' --repo "$GITHUB_REPOSITORY" --body "The approved scan completed and pushed branch \`$branch\`, but GitHub blocked automatic PR creation. Enable **Settings → Actions → General → Workflow permissions → Allow GitHub Actions to create and approve pull requests**, then comment \`APPROVE CATALOG MAINTENANCE\` again. Error: $(tr '\n' ' ' </tmp/pr-error.txt | head -c 500)"
              exit 1
            fi
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Close approved audit issue
        if: steps.changes.outputs.changed == 'true' && steps.pr.outputs.url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh issue close '${{ github.event.issue.number }}' --repo "$GITHUB_REPOSITORY" --comment "Approved maintenance completed. Review the generated PR before merging: ${{ steps.pr.outputs.url }}"

      - name: Close audit with no changes
        if: steps.changes.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh issue close '${{ github.event.issue.number }}' --repo "$GITHUB_REPOSITORY" --comment 'Approved deep maintenance completed; no repository changes were required.'
