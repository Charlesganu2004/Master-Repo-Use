name: Catalog Guardian

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'repo-lists/**'
      - 'scripts/catalog_guardian.py'
      - '.github/workflows/catalog-guardian.yml'
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: catalog-guardian
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deep-scan helpers
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check semgrep
          # The guardian also uses gitleaks, Trivy, OSV Scanner, ClamAV and Snyk
          # automatically when those executables/credentials are available.

      - name: Detect newly added repos
        id: additions
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git diff HEAD^ HEAD -- repo-lists/ \
            | sed -n 's/^+\([^+#][^ #]*\/[^ #]*\).*$/\1/p' \
            | sort -u > /tmp/new-repos.txt || true
          {
            echo 'repos<<EOF'
            cat /tmp/new-repos.txt || true
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Run metadata audit, deep scans and lifecycle proposals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--apply-removals)
          if [[ "${{ github.event_name }}" == 'workflow_dispatch' || "${{ github.event_name }}" == 'push' ]]; then
            args+=(--deep --batch-size 12)
          fi
          if [[ -s /tmp/new-repos.txt ]]; then
            while IFS= read -r repo; do
              [[ -n "$repo" ]] && args+=(--force-repo "$repo")
            done < /tmp/new-repos.txt
          fi
          python scripts/catalog_guardian.py "${args[@]}"

      - name: Build owner-review branch
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          branch='automation/catalog-guardian'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$branch"
          git add docs/ repo-lists/ managed-repos/
          git commit -m 'chore: propose catalog health and security updates'
          git push --force origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open or refresh owner-review PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          branch='${{ steps.changes.outputs.branch }}'
          existing="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"
          body=$(cat <<'EOF'
          Automated Catalog Guardian proposal.

          This PR may contain:
          - refreshed live catalog health/security status;
          - deep-scan findings for new or rotating repositories;
          - lifecycle removal proposals;
          - managed-adoption candidate notes for useful stale/archived code.

          Nothing in this PR should merge until @Charlesganu2004 reviews and approves it. The Owner Approval Check and CODEOWNERS rules are designed to enforce that policy.
          EOF
          )
          if [[ -n "$existing" ]]; then
            gh pr edit "$existing" --title 'chore: Catalog Guardian owner review' --body "$body"
          else
            gh pr create --head "$branch" --base main --title 'chore: Catalog Guardian owner review' --body "$body"
          fi
