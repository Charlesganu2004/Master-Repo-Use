name: Catalog Guardian

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'repo-lists/**'
      - 'scripts/catalog_guardian.py'
      - '.github/workflows/catalog-guardian.yml'
  schedule:
    - cron: '17 */6 * * *'
    - cron: '23 0 * * *'

permissions:
  contents: write

concurrency:
  group: catalog-guardian
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deep-scan helpers
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.schedule == '23 0 * * *'
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check semgrep
          # catalog_guardian.py also invokes gitleaks/trivy/osv-scanner/ClamAV
          # automatically when those executables are present on a runner or workstation.

      - name: Immediately deep-vet every newly added repo
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git diff HEAD^ HEAD -- repo-lists/all-curated.txt \
            | sed -n 's/^+\([^+#][^ #]*\/[^ #]*\).*$/\1/p' \
            | sort -u > /tmp/new-repos.txt || true
          if [[ ! -s /tmp/new-repos.txt ]]; then
            echo 'No new catalog repos in this commit.'
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          import datetime as dt
          from scripts.catalog_guardian import deep_scan, remove_from_repo_lists

          repos=[x.strip() for x in Path('/tmp/new-repos.txt').read_text().splitlines() if x.strip()]
          report=Path('docs/NEW-REPO-VETTING.md')
          existing=report.read_text() if report.exists() else '# New Repo Deep Vetting\n\n'
          stamp=dt.datetime.now(dt.timezone.utc).strftime('%Y-%m-%d %H:%M UTC')
          lines=[]
          for repo in repos:
              findings, critical = deep_scan(repo)
              highs=[x for x in findings if x.startswith('HIGH')]
              if critical:
                  status='REMOVED — critical security finding'
                  remove_from_repo_lists(repo)
              elif highs:
                  status='REVIEW REQUIRED — high-risk patterns detected'
              else:
                  status='PASS'
              lines.append(f'## {repo} — {status}\n\nScanned: {stamp}\n')
              if findings:
                  lines.extend(f'- {x}' for x in findings[:50])
              else:
                  lines.append('- Built-in deep checks found no high/critical patterns.')
              lines.append('')
          report.write_text(existing.rstrip()+'\n\n'+'\n'.join(lines)+'\n')
          PY

      - name: Metadata health + rotating deep scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          deep=''
          if [[ "${{ github.event_name }}" == 'workflow_dispatch' || "${{ github.event_name }}" == 'push' || "${{ github.event.schedule }}" == '23 0 * * *' ]]; then
            deep='--deep --batch-size 12'
          fi
          python scripts/catalog_guardian.py $deep --apply-removals

      - name: Commit refreshed dashboard, vetting results and approved removals
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No catalog status changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ repo-lists/
          git commit -m 'chore: refresh catalog security and health status'
          git push
