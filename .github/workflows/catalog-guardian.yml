name: Catalog Guardian

on:
  schedule:
    - cron: '23 7 * * 1'
  push:
    branches: [main]
    paths:
      - 'repo-lists/**'
      - 'scripts/catalog_guardian.py'
      - '.github/workflows/catalog-guardian.yml'
  workflow_dispatch:
  issue_comment:
    types: [created]

# Least privilege: read-only by default, widened only on the job that pushes.
permissions:
  contents: read

jobs:
  # Cheap weekly metadata pass. Deep scanning happens only for repositories newly
  # added to a catalog list, or when the owner approves maintenance below.
  audit:
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    concurrency:
      group: catalog-guardian-audit-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Detect newly added catalog repositories
        id: additions
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/new-repos.txt
          if [[ '${{ github.event_name }}' == 'push' ]]; then
            base='${{ github.event.before }}'
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              base='HEAD^'
            fi
            git diff "$base" HEAD -- 'repo-lists/*.txt' \
              | sed -n 's/^+\([^+#][^ #]*\/[^ #]*\).*$/\1/p' \
              | sort -u > /tmp/new-repos.txt || true
          fi
          {
            echo 'repos<<EOF'
            cat /tmp/new-repos.txt
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Set up Go for new-repo security intake
        if: steps.additions.outputs.repos != ''
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install new-repo scan helpers
        if: steps.additions.outputs.repos != ''
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Each scanner installs independently and NON-FATALLY. Guardian already
          # treats a missing scanner as SCANNER-ERROR rather than "clean", so one
          # broken installer must degrade the audit, not kill it. This step used to
          # be fail-hard and took the whole run down on 2026-08-25.
          install_failed=()

          python -m pip install --disable-pip-version-check semgrep \
            || { install_failed+=(semgrep); echo '::warning::semgrep install failed; findings from it will report as SCANNER-ERROR.'; }

          # gitleaks moved to the gitleaks org but its go.mod still declares the
          # module path as github.com/zricethezav/gitleaks/v8. Installing via the
          # new org path fails with "module declares its path as ...".
          go install github.com/zricethezav/gitleaks/v8@latest \
            || { install_failed+=(gitleaks); echo '::warning::gitleaks install failed; secret scanning will report as SCANNER-ERROR.'; }

          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@latest \
            || { install_failed+=(osv-scanner); echo '::warning::osv-scanner install failed; dependency scanning will report as SCANNER-ERROR.'; }

          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq clamav \
            || { install_failed+=(clamav); echo '::warning::clamav install failed; malware scanning will report as SCANNER-ERROR.'; }
          sudo systemctl stop clamav-freshclam 2>/dev/null || true
          sudo freshclam --quiet || echo '::warning::freshclam could not update ClamAV signatures; malware scanning will be reported as a scanner error, not as a finding.'
          if [[ -n "${SNYK_TOKEN:-}" ]]; then
            npm install -g snyk || { install_failed+=(snyk); echo '::warning::snyk install failed; it will be skipped.'; }
          fi

          if (( ${#install_failed[@]} )); then
            echo "::warning::Scanners unavailable this run: ${install_failed[*]}. Guardian reports these as SCANNER-ERROR, which means 'rescan needed', not 'nothing found'."
          fi

      - name: Refresh metadata and deep-scan new additions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r repo; do
            [[ -n "$repo" ]] && args+=(--force-repo "$repo")
          done < /tmp/new-repos.txt
          python scripts/catalog_guardian.py "${args[@]}"

      - name: Build audit issue body
        id: report
        shell: bash
        run: |
          python - <<'PY' > /tmp/catalog-audit.md
          import json
          from pathlib import Path
          data = json.loads(Path('docs/catalog-status.json').read_text(encoding='utf-8'))
          counts = data.get('counts', {})
          attention = [r for r in data.get('repos', []) if r.get('status') != 'HEALTHY']
          print('# Master Repo catalog audit')
          print()
          print(f"Generated: **{data.get('updated', 'unknown')}**")
          print()
          print(f"Healthy **{counts.get('HEALTHY', 0)}** · Stale **{counts.get('STALE', 0)}** · Review **{counts.get('REVIEW', 0)}** · Remove **{counts.get('REMOVE', 0)}**")
          print()
          print('This audit is generated by GitHub Actions and does **not** call GPT, Claude, Copilot, Codex, or any paid AI API.')
          print()
          if attention:
              print('| Repo | Status | Push age | Archived | Note |')
              print('|---|---|---:|---:|---|')
              for r in sorted(attention, key=lambda x: (x.get('status',''), x.get('repo',''))):
                  note = (r.get('note') or '').replace('|', '/').replace('\n', ' ')[:300]
                  age = f"{r.get('age_days')}d" if r.get('age_days') is not None else '—'
                  print(f"| `{r.get('repo')}` | **{r.get('status')}** | {age} | {'yes' if r.get('archived') else 'no'} | {note} |")
          else:
              print('No repository currently needs lifecycle/security attention.')
          print()
          print('## Owner approval gate')
          print()
          print('If you want the repository to perform the deeper deterministic security/lifecycle maintenance now, comment exactly:')
          print()
          print('`APPROVE CATALOG MAINTENANCE`')
          print()
          print('That approval runs a rotating deep scan plus all current REVIEW/REMOVE candidates, applies removal proposals on an automation branch, and opens a PR. **It never merges `main` automatically.**')
          print()
          print('Deep intake uses built-in invisible/prompt/SQL/command/secret/binary checks plus Semgrep, Gitleaks, OSV Scanner and ClamAV. Snyk runs when SNYK_TOKEN is configured. Additional supported scanners such as Trivy can also be installed without changing Guardian.')
          print()
          print('Secret values are never printed: Gitleaks runs with `--redact` and only rule, file and line are reported. A `SCANNER-ERROR` note means a scanner failed to run (for example ClamAV without a signature database) and the repository should be rescanned — it is **not** a claim that anything was found.')
          print()
          print('Policy: 120d stale warning · 270d replacement/managed-adoption review · 365d runtime removal threshold. Archived repos are reviewed for releases, sunset/EOL, successors, reference value, license, and security before removal.')
          PY
          attention="$(python - <<'PY'
          import json
          d=json.load(open('docs/catalog-status.json', encoding='utf-8'))
          print(sum(v for k,v in d.get('counts',{}).items() if k != 'HEALTHY'))
          PY
          )"
          echo "attention=$attention" >> "$GITHUB_OUTPUT"

      - name: Create or refresh owner audit issue
        if: steps.report.outputs.attention != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title [Catalog Audit]' --json number,title --jq '[.[] | select(.title | startswith("[Catalog Audit]"))][0].number // empty')"
          title='[Catalog Audit] Owner approval required'
          if [[ -n "$existing" ]]; then
            gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --title "$title" --body-file /tmp/catalog-audit.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file /tmp/catalog-audit.md --assignee Charlesganu2004
          fi

  # ---------------------------------------------------------------------------
  # Rotating deep security scan.
  #
  # Why this exists: before 2026-08-25, deep scanning ran ONLY on newly-added repos
  # or after a manual `APPROVE CATALOG MAINTENANCE` comment. Neither had ever
  # happened at scale, so 0 of 252 catalogued repositories had ever been scanned for
  # malware, secrets, invisible/bidi characters, prompt injection or SQL injection.
  # The weekly job was metadata-only and silently skipped the scanner install.
  #
  # Scanning is READ-ONLY, so it does not need the owner gate. Owner approval still
  # governs anything that CHANGES the catalog (`--apply-removals`), which this job
  # deliberately does not pass. Findings are reported; removals stay owner-gated.
  #
  # Cost: one shallow blobless clone per repo, ~19 repos per run at batch-size 20,
  # full catalog coverage in about 13 weeks. State accumulates through the Actions
  # cache so `deep_scanned` coverage grows instead of resetting every run.
  deep-scan-rotation:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    concurrency:
      group: catalog-guardian-deep-rotation
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Check the Actions budget before spending 45 minutes
        id: budget
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A skipped scan is recoverable; an overrun is a bill. The rotation is
          # the largest single cost in this repository, so it checks first.
          if python scripts/actions_budget.py --gate --reserve 600 --report; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Deep scan skipped: Actions headroom is below the 600 minute reserve."
          fi

      - name: Restore accumulated scan state
        if: steps.budget.outputs.ok == 'true'
        uses: actions/cache@v4
        with:
          path: docs/catalog-status.json
          key: catalog-scan-state-${{ github.run_id }}
          restore-keys: |
            catalog-scan-state-

      - name: Install scanners
        if: steps.budget.outputs.ok == 'true'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          install_failed=()
          python -m pip install --disable-pip-version-check semgrep \
            || { install_failed+=(semgrep); echo '::warning::semgrep install failed; findings from it will report as SCANNER-ERROR.'; }
          go install github.com/zricethezav/gitleaks/v8@latest \
            || { install_failed+=(gitleaks); echo '::warning::gitleaks install failed; secret scanning will report as SCANNER-ERROR.'; }
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@latest \
            || { install_failed+=(osv-scanner); echo '::warning::osv-scanner install failed; dependency scanning will report as SCANNER-ERROR.'; }
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq clamav \
            || { install_failed+=(clamav); echo '::warning::clamav install failed; malware scanning will report as SCANNER-ERROR.'; }
          sudo systemctl stop clamav-freshclam 2>/dev/null || true
          sudo freshclam --quiet || echo '::warning::freshclam could not update ClamAV signatures; malware scanning reports SCANNER-ERROR, not a finding.'
          if (( ${#install_failed[@]} )); then
            echo "::warning::Scanners unavailable this run: ${install_failed[*]}. SCANNER-ERROR means 'rescan needed', not 'nothing found'."
          fi

      - name: Pick this week's rotation slice
        if: steps.budget.outputs.ok == 'true'
        id: slice
        shell: bash
        run: |
          set -euo pipefail
          # Deterministic rotation: whole weeks since the epoch. No randomness, so a
          # re-run scans the same slice and the schedule advances predictably.
          week=$(( $(date -u +%s) / 604800 ))
          echo "index=$week" >> "$GITHUB_OUTPUT"
          echo "Rotation batch index: $week"

      - name: Rotating deep scan (read-only, no removals)
        if: steps.budget.outputs.ok == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/catalog_guardian.py --deep --batch-size 20 \
            --batch-index '${{ steps.slice.outputs.index }}'

      - name: Report security findings
        if: steps.budget.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: python scripts/security_report.py

      - name: Write the security trail and say what was done
        if: always() && steps.budget.outputs.ok == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Runs even when the scan failed, because "the scan did not finish" is
          # exactly the kind of thing the trail exists to record.
          BUDGET=$(python scripts/actions_budget.py --repo "$GITHUB_REPOSITORY" | grep -m1 used | tr -s " " | cut -d" " -f3-6)
          python scripts/security_trail.py             --action "deep-scan-rotation"             --scope "rotating slice of the catalog, read-only"             --outcome "job status ${{ job.status }}; see the linked run for findings"             --approval "scheduled rotation; read-only, so no owner phrase required"             --budget "${BUDGET:-unknown}"


  # Separate job on purpose. deep-scan-rotation clones third-party repositories,
  # so it stays contents: read. This one clones nothing but this repository, which
  # is why it is the only place a write token appears.
  record-trail:
    needs: deep-scan-rotation
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Append the row
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUDGET=$(python scripts/actions_budget.py --repo "$GITHUB_REPOSITORY" | grep -m1 used | tr -s " " | cut -d" " -f3-6)
          python scripts/security_trail.py             --action "deep-scan-rotation"             --scope "rotating slice of the catalog, read-only"             --outcome "scan job finished with status ${{ needs.deep-scan-rotation.result }}"             --approval "scheduled rotation; read-only, so no owner phrase required"             --budget "${BUDGET:-unknown}"

      - name: Commit to the automation branch, never to main
        run: |
          if git diff --quiet -- docs/SECURITY-TRAIL.md; then
            echo "nothing to record"
            exit 0
          fi
          git config user.name "Charles Ganu"
          git config user.email "charlesganu2004@gmail.com"
          git add docs/SECURITY-TRAIL.md
          git commit -m "trail: deep-scan rotation ${{ github.run_id }}"
          # A bare --force-with-lease leases against the remote-tracking ref, and
          # this job's checkout fetches only main, so the trail branch falls outside
          # the fetch refspec and git reads the lease as stale however recently the
          # ref was fetched. It refuses with "stale info" instead of pushing, which
          # is how every scheduled run after the one that created this branch lost
          # its row. Name the expected value instead: ls-remote reads the tip, the
          # lease holds the push to exactly that tip, and a branch that does not
          # exist yet has nothing to force past.
          if tip=$(git ls-remote --exit-code origin refs/heads/automation/security-trail | cut -f1); then
            git push origin "HEAD:automation/security-trail" \
              --force-with-lease="automation/security-trail:$tip"
          else
            git push origin "HEAD:automation/security-trail"
          fi

  approved-maintenance:
    if: >-
      github.event_name == 'issue_comment' &&
      github.actor == 'Charlesganu2004' &&
      github.event.issue.pull_request == null &&
      startsWith(github.event.issue.title, '[Catalog Audit]') &&
      github.event.comment.body == 'APPROVE CATALOG MAINTENANCE'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
      issues: write
      pull-requests: write
      statuses: write
    concurrency:
      group: catalog-guardian-approved-maintenance
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install owner-approved scan helpers
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Each scanner installs independently and NON-FATALLY. Guardian already
          # treats a missing scanner as SCANNER-ERROR rather than "clean", so one
          # broken installer must degrade the audit, not kill it. This step used to
          # be fail-hard and took the whole run down on 2026-08-25.
          install_failed=()

          python -m pip install --disable-pip-version-check semgrep \
            || { install_failed+=(semgrep); echo '::warning::semgrep install failed; findings from it will report as SCANNER-ERROR.'; }

          # gitleaks moved to the gitleaks org but its go.mod still declares the
          # module path as github.com/zricethezav/gitleaks/v8. Installing via the
          # new org path fails with "module declares its path as ...".
          go install github.com/zricethezav/gitleaks/v8@latest \
            || { install_failed+=(gitleaks); echo '::warning::gitleaks install failed; secret scanning will report as SCANNER-ERROR.'; }

          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@latest \
            || { install_failed+=(osv-scanner); echo '::warning::osv-scanner install failed; dependency scanning will report as SCANNER-ERROR.'; }

          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq clamav \
            || { install_failed+=(clamav); echo '::warning::clamav install failed; malware scanning will report as SCANNER-ERROR.'; }
          sudo systemctl stop clamav-freshclam 2>/dev/null || true
          sudo freshclam --quiet || echo '::warning::freshclam could not update ClamAV signatures; malware scanning will be reported as a scanner error, not as a finding.'
          if [[ -n "${SNYK_TOKEN:-}" ]]; then
            npm install -g snyk || { install_failed+=(snyk); echo '::warning::snyk install failed; it will be skipped.'; }
          fi

          if (( ${#install_failed[@]} )); then
            echo "::warning::Scanners unavailable this run: ${install_failed[*]}. Guardian reports these as SCANNER-ERROR, which means 'rescan needed', not 'nothing found'."
          fi

      - name: Run deep guardian and prepare lifecycle changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/catalog_guardian.py --deep --batch-size 12 --apply-removals

      - name: Create automation branch
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          branch='automation/catalog-guardian'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$branch"
          git add docs/ repo-lists/ managed-repos/
          git commit -m 'chore: propose owner-approved catalog maintenance'
          git push --force origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open or refresh owner-review PR
        if: steps.changes.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          branch='${{ steps.changes.outputs.branch }}'
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"
          body=$(cat <<'EOF'
          Owner-approved Catalog Guardian proposal.

          This PR can contain refreshed health/security state, lifecycle removals, replacement decisions, and managed-adoption candidate notes. The audit was generated by deterministic GitHub Actions tooling, not a paid AI background worker.

          Nothing in this PR should merge until @Charlesganu2004 reviews the exact current head. The required `owner-approval` status is SHA-bound and cannot be satisfied by the automation itself.
          EOF
          )
          if [[ -n "$existing" ]]; then
            pr_number="$existing"
            gh pr edit "$existing" --repo "$GITHUB_REPOSITORY" --title 'chore: Catalog Guardian owner review' --body "$body"
            url="$(gh pr view "$existing" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
          else
            set +e
            url="$(gh pr create --repo "$GITHUB_REPOSITORY" --head "$branch" --base main --title 'chore: Catalog Guardian owner review' --body "$body" 2>/tmp/pr-error.txt)"
            rc=$?
            set -e
            if [[ $rc -ne 0 ]]; then
              gh issue comment '${{ github.event.issue.number }}' --repo "$GITHUB_REPOSITORY" --body "The approved scan completed and pushed branch \`$branch\`, but GitHub blocked automatic PR creation. Enable **Settings → Actions → General → Workflow permissions → Allow GitHub Actions to create and approve pull requests**, then comment \`APPROVE CATALOG MAINTENANCE\` again. Error: $(tr '\n' ' ' </tmp/pr-error.txt | head -c 500)"
              exit 1
            fi
            pr_number="$(gh pr view "$url" --repo "$GITHUB_REPOSITORY" --json number --jq .number)"
          fi
          head_sha="$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$head_sha" \
            -f state='pending' \
            -f context='owner-approval' \
            -f description='Waiting for Charles approval on the current PR head' \
            -f target_url="$url" >/dev/null
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Close approved audit issue
        if: steps.changes.outputs.changed == 'true' && steps.pr.outputs.url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh issue close '${{ github.event.issue.number }}' --repo "$GITHUB_REPOSITORY" --comment "Approved maintenance completed. Review the generated PR before merging: ${{ steps.pr.outputs.url }}"

      - name: Close audit with no changes
        if: steps.changes.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh issue close '${{ github.event.issue.number }}' --repo "$GITHUB_REPOSITORY" --comment 'Approved deep maintenance completed; no repository changes were required.'
