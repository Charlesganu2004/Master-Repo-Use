name: Catalog Guardian (Manual / Owner Approved)

on:
  workflow_dispatch:
    inputs:
      deep_scan:
        description: 'Run rotating deep scans with open-source scanners'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: catalog-guardian-manual
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install optional open-source scan helper
        if: inputs.deep_scan == true
        shell: bash
        run: python -m pip install --disable-pip-version-check semgrep

      - name: Run owner-requested catalog audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--apply-removals)
          if [[ '${{ inputs.deep_scan }}' == 'true' ]]; then
            args+=(--deep --batch-size 12)
          fi
          python scripts/catalog_guardian.py "${args[@]}"

      - name: Build owner-review branch
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          branch='automation/catalog-guardian'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$branch"
          git add docs/ repo-lists/ managed-repos/
          git commit -m 'chore: propose catalog health and security updates'
          git push --force origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open or refresh owner-review PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          branch='${{ steps.changes.outputs.branch }}'
          existing="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"
          body=$(cat <<'EOF'
          Owner-requested Catalog Guardian proposal.

          This workflow is manual-only to avoid recurring private-repository Actions cost. It may contain refreshed health/security status, lifecycle removal proposals, and managed-adoption candidates.

          Nothing should merge until @Charlesganu2004 reviews and approves it.
          EOF
          )
          if [[ -n "$existing" ]]; then
            gh pr edit "$existing" --title 'chore: Catalog Guardian owner review' --body "$body"
          else
            gh pr create --head "$branch" --base main --title 'chore: Catalog Guardian owner review' --body "$body"
          fi
