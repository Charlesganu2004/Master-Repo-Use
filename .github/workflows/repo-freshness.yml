name: Catalog freshness

# Checks every repo in repo-lists/ against GitHub, refreshes docs/REPO-HEALTH.md,
# and opens (or updates) a single tracking issue when repos go stale.
#
# Runs weekly. Also runnable on demand from the Actions tab.

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: catalog-freshness
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check catalog freshness
        id: check
        # GITHUB_TOKEN raises the API limit to 5000/hr, which the catalog needs.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python scripts/check_freshness.py --json freshness.json | tee report.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Commit refreshed REPO-HEALTH.md
        run: |
          if git diff --quiet -- docs/REPO-HEALTH.md; then
            echo "No health changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/REPO-HEALTH.md
          git commit -m "chore: refresh catalog health check"
          git push

      - name: Open or update the tracking issue
        if: steps.check.outputs.exit_code == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('freshness.json', 'utf8'));
            const BAD = ['missing','archived','deprecated','unmaintained','stale'];
            const flagged = data.repos.filter(r => BAD.includes(r.status));
            if (!flagged.length) return;

            const TITLE = 'Catalog freshness: repos need attention';
            const rows = flagged
              .sort((a,b) => BAD.indexOf(a.status) - BAD.indexOf(b.status))
              .map(r => `| [${r.repo}](https://github.com/${r.repo}) | \`${r.status}\` | ${r.pushed || '—'} | ${r.lists.join(', ')} |`)
              .join('\n');

            const body = [
              `Automated check on **${data.checked}** found **${flagged.length}** repo(s) needing attention.`,
              '',
              '| Repo | Status | Last push | Listed in |',
              '| --- | --- | --- | --- |',
              rows,
              '',
              'Status meanings: [docs/REPO-HEALTH.md](../blob/main/docs/REPO-HEALTH.md)',
              '',
              'For each one, decide: keep and note the risk, find a maintained replacement, or drop it.',
              'Any replacement must be vetted first — see [docs/SECURITY-SCANNING.md](../blob/main/docs/SECURITY-SCANNING.md).',
              '',
              '<sub>Updated automatically by `.github/workflows/repo-freshness.yml`.</sub>',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'catalog-freshness', per_page: 10,
            });

            if (existing.data.length) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
              core.info(`Updated issue #${existing.data[0].number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: TITLE, body, labels: ['catalog-freshness'],
              });
              core.info(`Opened issue #${created.data.number}`);
            }

      - name: Close the tracking issue when everything is healthy
        if: steps.check.outputs.exit_code == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'catalog-freshness', per_page: 10,
            });
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: 'All catalogued repos are active or slow as of the latest check. Closing.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: 'closed',
              });
            }
