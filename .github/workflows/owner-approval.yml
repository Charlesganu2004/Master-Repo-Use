name: Owner Approval Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

# Supersede in-flight checks when a PR is pushed to again, so a burst of commits
# costs one run instead of one per commit.
concurrency:
  group: owner-approval-${{ github.event.pull_request.number || github.event.review.id }}
  cancel-in-progress: true

jobs:
  owner-approval:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require @Charlesganu2004 approval
        uses: actions/github-script@v7
        with:
          script: |
            const owner = 'Charlesganu2004';
            const { owner: repoOwner, repo } = context.repo;
            const pull_number = context.payload.pull_request?.number || context.payload.review?.pull_request_url?.split('/').pop();
            if (!pull_number) core.setFailed('Could not resolve pull request number.');
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: repoOwner,
              repo,
              pull_number: Number(pull_number),
              per_page: 100
            });
            const latest = new Map();
            for (const review of reviews) {
              if (!review.user?.login) continue;
              latest.set(review.user.login.toLowerCase(), review.state);
            }
            const state = latest.get(owner.toLowerCase());
            if (state !== 'APPROVED') {
              core.setFailed(`@${owner} must approve this pull request before it can merge.`);
            }
