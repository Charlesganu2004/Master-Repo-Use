<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Split one system into bold, selectable bands of capability. The full Master Repo Atlas sits behind the chrome.">
<title>Prism | Master Repo</title>
<link rel="stylesheet" href="themes.css">
<link rel="stylesheet" href="atlas-exhibition.css">
</head>
<body>
<noscript>This interactive Atlas requires JavaScript. All data remains local to this page.</noscript>
<script src="atlas-theme.js"></script>
<script src="atlas-data.js"></script>
<script src="atlas-core.js"></script>
<script src="atlas-panes.js"></script>
<script src="atlas-exhibition.js"></script>
<script>
/* The scene, its styling and its renderer all live in atlas-exhibition.
   This file existed in the gallery list for a while with no page behind it, so
   clicking Prism was a 404. The shell already had the scene; only the page was
   missing. */
AtlasExhibition.workspace({
  skin:'prism',
  title:'Prism Atlas',
  eyebrow:'Split-band workspace',
  note:'One system split into bands of capability, each band a family you can open.',
  theme:'plum'
});
AtlasExhibition.mount('prism');
</script>
</body>
</html>
