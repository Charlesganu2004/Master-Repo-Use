<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbital | Master Repo Atlas</title>
<style>
:root{
  --bg:#0a0910; --panel:#12101c; --line:#241f38; --ink:#ece9f5; --dim:#8f87ad;
  --accent:#f472b6; --accent2:#818cf8; --warn:#fbbf24;
  --instruction:#f472b6; --capability:#818cf8; --knowledge:#38bdf8;
  --control:#fb923c; --model:#facc15; --delivery:#4ade80;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(ellipse at 50% 40%,#151030 0%,var(--bg) 62%);
  color:var(--ink);font-family:var(--font);font-size:15px;min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

.hw{position:sticky;top:0;z-index:60;background:rgba(10,9,16,.92);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);padding:10px 20px;display:flex;gap:16px;
  align-items:center;flex-wrap:wrap}
.hw h1{font-size:15px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.hw h1 span{background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.hw-step{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--dim);
  border:1px solid var(--line);border-radius:999px;padding:5px 13px}
.hw-scan{font-family:var(--mono);font-size:11px;background:rgba(0,0,0,.5);
  border:1px solid var(--line);border-radius:7px;padding:6px 10px;color:var(--accent2);
  max-width:min(44vw,520px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  cursor:pointer}
.hw-scan:hover{border-color:var(--accent2)}
.hw input{width:76px;background:rgba(0,0,0,.5);border:1px solid var(--line);border-radius:7px;
  color:var(--ink);padding:5px 9px;font-family:var(--mono);font-size:12px}
.tier{color:var(--accent);font-weight:600}

.tabs{display:flex;gap:5px;padding:11px 20px;flex-wrap:wrap;
  border-bottom:1px solid var(--line);position:sticky;top:53px;z-index:55;
  background:rgba(10,9,16,.92);backdrop-filter:blur(16px)}
.tab{padding:7px 14px;font-size:12.5px;color:var(--dim);border-radius:999px;
  border:1px solid transparent;transition:.16s;white-space:nowrap}
.tab:hover{color:var(--ink);border-color:var(--line)}
.tab[aria-selected=true]{color:#0a0910;background:linear-gradient(90deg,var(--accent),var(--accent2));
  font-weight:700}

.wrap{display:grid;grid-template-columns:1fr 372px;min-height:calc(100vh - 100px)}
@media(max-width:1080px){.wrap{grid-template-columns:1fr}}
#stage{min-width:0;overflow:hidden;position:relative}
.side{border-left:1px solid var(--line);background:rgba(18,16,28,.7);backdrop-filter:blur(10px);
  padding:18px;overflow-y:auto;max-height:calc(100vh - 100px);position:sticky;top:100px;min-width:0}
@media(max-width:1080px){.side{position:static;max-height:none;border-left:none;
  border-top:1px solid var(--line)}}

/* ---- orbital rings ---- */
svg.orbit{width:100%;height:calc(100vh - 100px);display:block}
@media(max-width:1080px){svg.orbit{height:66vh}}
.ring{fill:none;stroke:var(--line);stroke-width:1}
.ring.hot{stroke:var(--accent2);stroke-opacity:.55}
.spoke{stroke:var(--accent);stroke-width:1.4;opacity:0;transition:opacity .25s}
.spoke.on{opacity:.75}
.orb{cursor:pointer;transition:r .2s}
.orb:hover{filter:brightness(1.6)}
.orb.sel{stroke:#fff;stroke-width:2.5}
.olabel{font-size:9px;fill:var(--dim);pointer-events:none;text-anchor:middle;
  opacity:0;transition:opacity .2s}
.og:hover .olabel,.og.sel .olabel{opacity:1;fill:var(--ink)}
.og.faded{opacity:.14}
.famlabel{font-size:10.5px;fill:var(--dim);font-family:var(--mono);cursor:pointer;
  letter-spacing:.06em}
.famlabel:hover{fill:var(--ink)}
.famlabel.on{fill:var(--accent)}
.hud{position:absolute;left:18px;top:18px;font-family:var(--mono);font-size:11px;
  color:var(--dim);line-height:1.75;background:rgba(18,16,28,.85);border:1px solid var(--line);
  border-radius:10px;padding:10px 13px}
.hud b{color:var(--accent);font-variant-numeric:tabular-nums}
.spin{position:absolute;right:18px;top:18px;display:flex;gap:6px}
.spin button{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;
  color:var(--dim);background:rgba(18,16,28,.85)}
.spin button:hover{color:var(--ink);border-color:var(--accent2)}
.spin button.on{color:var(--accent);border-color:var(--accent)}

/* ---- shared pane + detail ---- */
.pane{padding:22px;max-height:calc(100vh - 100px);overflow-y:auto}
h2{font-size:19px;letter-spacing:-.02em;margin-bottom:5px}
.sub{color:var(--dim);font-size:13px;margin-bottom:18px;line-height:1.6}
.sec{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
  margin:18px 0 9px;font-weight:600}
.sec:first-child{margin-top:0}
.dname{font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.dkind{display:inline-block;font-size:10.5px;padding:3px 10px;border-radius:999px;
  margin-top:7px;border:1px solid var(--line);color:var(--dim)}
.ddesc{color:#cdc7e0;line-height:1.62;font-size:13.5px;margin-top:11px}
.meta{font-size:12px;color:var(--dim);margin-top:9px;line-height:1.7}
.meta code{font-family:var(--mono);color:var(--accent2);font-size:11.5px}
.cmd{background:rgba(0,0,0,.55);border:1px solid var(--line);border-radius:10px;
  padding:11px 13px;font-family:var(--mono);font-size:11.5px;color:var(--accent2);
  word-break:break-all;line-height:1.55;position:relative}
.cmd.wrap{white-space:pre-wrap}
.copy{position:absolute;right:7px;top:7px;font-size:10px;color:var(--dim);
  border:1px solid var(--line);border-radius:6px;padding:2px 7px;background:var(--panel)}
.copy:hover{color:var(--accent);border-color:var(--accent)}
.conn{display:flex;flex-direction:column;gap:5px}
.conn button{text-align:left;font-size:12.5px;padding:8px 12px;border-radius:999px;
  border:1px solid var(--line);color:#cdc7e0;width:100%;transition:.16s}
.conn button:hover{border-color:var(--accent);transform:translateX(4px)}
.conn small{display:block;color:var(--dim);font-size:11px;margin-top:2px}
.route{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.route b{font-size:13px;display:block}
.route p{font-size:12px;color:var(--dim);margin-top:4px;line-height:1.5}
.route .tag{font-size:10.5px;color:var(--accent2);margin-top:6px;display:inline-block}
.route .tag.no{color:var(--warn)}
.route .path{font-size:11px;margin-top:6px;color:var(--dim)}
.empty{color:var(--dim);font-size:13px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(266px,1fr));gap:10px}
.lane-card{border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;
  transition:.16s;background:rgba(18,16,28,.6)}
.lane-card:hover{border-color:var(--accent);transform:translateY(-3px)}
.lane-card.active{border-color:var(--accent)}
.lane-card b{font-size:14px}
.lane-card p{font-size:12.5px;color:var(--dim);margin-top:5px;line-height:1.55}
.lane-card .src{font-family:var(--mono);font-size:11px;color:var(--accent2);margin-top:7px;
  display:block;word-break:break-all}
.verdict{color:var(--accent)}
.form{max-width:450px}
label{display:block;font-size:12px;color:var(--dim);margin:11px 0 5px}
input[type=text],textarea,select{width:100%;background:rgba(0,0,0,.5);
  border:1px solid var(--line);border-radius:9px;color:var(--ink);padding:9px 12px;
  font-family:inherit;font-size:13px}
textarea{min-height:74px;resize:vertical}
.btn{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#0a0910;
  font-weight:700;padding:10px 18px;border-radius:999px;font-size:13px;margin-top:14px}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink);font-weight:500;
  padding:6px 13px;margin-top:9px}
.err{color:var(--warn);font-size:12.5px;margin-top:9px}
</style>
</head>
<body>

<div class="hw">
  <h1>Orbital <span>Atlas</span></h1>
  <div class="hw-step"><span>1. Scan this machine</span>
    <button class="hw-scan" id="scan">loading…</button></div>
  <div class="hw-step"><span>2. RAM</span>
    <input id="ram" type="number" min="1" max="512" placeholder="GB">
    <span id="tier" class="tier">not set</span></div>
</div>

<div class="tabs" id="tabs" role="tablist"></div>

<div class="wrap">
  <div id="stage"></div>
  <aside class="side" id="side"></aside>
</div>

<script src="atlas-data.js"></script>
<script src="atlas-core.js"></script>
<script src="atlas-panes.js"></script>
<script>
'use strict';
const A = AtlasCore, P = AtlasPanes;
const esc = P.esc;
const NS = 'http://www.w3.org/2000/svg';
let angle = 0, spinning = true, spinRaf = null;

/* One ring per family, ordered outward by the reading order of the system.
   Rotating the whole field is the navigation: bring a family to the front,
   then click into it. */
function renderMap(stage){
  stage.innerHTML = `<svg class="orbit" id="orbit"></svg>
    <div class="hud" id="hud"></div>
    <div class="spin">
      <button id="toggle" class="${spinning ? 'on' : ''}">${spinning ? 'pause' : 'spin'}</button>
      <button id="reset">reset filters</button>
    </div>`;
  document.getElementById('toggle').onclick = () => {
    spinning = !spinning;
    document.getElementById('toggle').textContent = spinning ? 'pause' : 'spin';
    document.getElementById('toggle').classList.toggle('on', spinning);
    if (spinning) spin();
  };
  document.getElementById('reset').onclick = () => { A.clearFilters(); renderMap(stage); };
  build();
  spin();
}

function build(){
  const svg = document.getElementById('orbit');
  if (!svg) return;
  const W = svg.clientWidth || 900, H = svg.clientHeight || 620;
  const cx = W / 2, cy = H / 2;
  const families = A.state.data.families;
  const lanes = A.visibleLanes();
  const comps = A.visibleComponents();
  const maxR = Math.min(W, H) / 2 - 46;
  const step = maxR / (families.length + 1);

  svg.innerHTML = '';
  const gRings = document.createElementNS(NS,'g');
  const gSpokes = document.createElementNS(NS,'g'); gSpokes.id = 'spokes';
  const gOrbs = document.createElementNS(NS,'g'); gOrbs.id = 'orbs';
  svg.append(gRings, gSpokes, gOrbs);

  families.forEach((fam, fi) => {
    const r = step * (fi + 1.2);
    const ring = document.createElementNS(NS,'circle');
    ring.setAttribute('class','ring' + (A.state.activeFamilies.has(fam.id) ? ' hot' : ''));
    ring.setAttribute('cx',cx); ring.setAttribute('cy',cy); ring.setAttribute('r',r);
    gRings.appendChild(ring);

    const label = document.createElementNS(NS,'text');
    label.setAttribute('class','famlabel' + (A.state.activeFamilies.has(fam.id) ? ' on' : ''));
    label.setAttribute('x', cx + 5); label.setAttribute('y', cy - r - 5);
    label.textContent = fam.name;
    label.onclick = () => { A.toggleFamily(fam.id); build(); };
    gRings.appendChild(label);

    const members = comps.filter(c => c.family === fam.id);
    // A family with 200 components turns one ring into a solid band. Split it
    // across concentric sub-rings so density stays readable and the ring still
    // reads as one family.
    const PER_RING = 34;
    const subRings = Math.max(1, Math.ceil(members.length / PER_RING));
    const subGap = step * 0.72 / subRings;
    members.forEach((c, i) => {
      const sub = i % subRings;
      const inRing = Math.floor(i / subRings);
      const perSub = Math.ceil(members.length / subRings);
      const a = (inRing / Math.max(perSub,1)) * Math.PI * 2 + sub * 0.11;
      const g = document.createElementNS(NS,'g');
      g.setAttribute('class','og'); g.dataset.id = c.id;
      // Clamp: an inner family with many sub-rings can otherwise push the
      // radius below zero, which SVG rejects outright.
      g.dataset.r = Math.max(14, r - (subRings > 1 ? sub * subGap : 0));
      g.dataset.a = a;
      const orb = document.createElementNS(NS,'circle');
      orb.setAttribute('class','orb'); orb.setAttribute('r',5);
      orb.setAttribute('fill',`var(--${c.kind})`);
      const t = document.createElementNS(NS,'text');
      t.setAttribute('class','olabel'); t.setAttribute('dy','-10');
      t.textContent = c.name.slice(0,24);
      g.append(orb,t);
      g.onclick = () => A.select(c.id);
      gOrbs.appendChild(g);
    });
  });
  place();
  hud();
}

function place(){
  const svg = document.getElementById('orbit');
  if (!svg) return;
  const W = svg.clientWidth || 900, H = svg.clientHeight || 620;
  const cx = W/2, cy = H/2;
  const sel = A.state.selected;
  const lit = new Set();
  if (sel){
    lit.add(sel);
    const d = A.detailFor(sel);
    if (d) d.connections.forEach(c => lit.add(c.id));
  }
  const at = new Map();
  document.querySelectorAll('.og').forEach(g => {
    const r = Number(g.dataset.r), a = Number(g.dataset.a) + angle;
    const x = cx + Math.cos(a)*r, y = cy + Math.sin(a)*r;
    g.setAttribute('transform',`translate(${x},${y})`);
    g.classList.toggle('sel', g.dataset.id === sel);
    g.classList.toggle('faded', !!sel && !lit.has(g.dataset.id));
    const orb = g.querySelector('.orb');
    if (orb) orb.setAttribute('r', Math.max(1, g.dataset.id === sel ? 8.5 : lit.has(g.dataset.id) ? 6.5 : 5));
    at.set(g.dataset.id, [x,y]);
  });
  // spokes: straight lines from the selected orb to everything it connects to
  const gs = document.getElementById('spokes');
  if (!gs) return;
  gs.innerHTML = '';
  if (sel && at.has(sel)){
    const [x1,y1] = at.get(sel);
    lit.forEach(id => {
      if (id === sel || !at.has(id)) return;
      const [x2,y2] = at.get(id);
      const l = document.createElementNS(NS,'line');
      l.setAttribute('class','spoke on');
      l.setAttribute('x1',x1); l.setAttribute('y1',y1);
      l.setAttribute('x2',x2); l.setAttribute('y2',y2);
      gs.appendChild(l);
    });
  }
}

function spin(){
  if (spinRaf) cancelAnimationFrame(spinRaf);
  const loop = () => {
    if (!spinning) { spinRaf = null; return; }
    angle += 0.0012;
    place();
    spinRaf = requestAnimationFrame(loop);
  };
  spinRaf = requestAnimationFrame(loop);
}

function hud(){
  const c = A.counts();
  const el = document.getElementById('hud');
  if (!el) return;
  el.innerHTML =
    `<b>${c.visibleLanes}</b> / ${c.lanes} lanes<br>` +
    `<b>${c.visibleComponents}</b> / ${c.components} components<br>` +
    `<b>${A.state.data.families.length}</b> rings<br>` +
    `<span style="opacity:.65">click a ring label to filter</span>`;
}

P.mount({
  renderMap,
  onSelect: () => place(),
});
A.on(() => { place(); hud(); });
window.addEventListener('resize', () => { if (P.tab === 'map') build(); });
</script>
</body>
</html>
