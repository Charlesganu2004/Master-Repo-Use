<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A curved CRT in a plastic bezel: aperture grille, phosphor bloom and a rolling interference bar.">
<title>Tube | Master Repo</title>
<link rel="stylesheet" href="themes.css">
<style>
/* ===========================================================================
   TUBE. The whole page is one piece of curved glass in a plastic bezel. It is
   the only page in the set with a visible physical enclosure, which is what
   makes it recognisable instantly.

   Four things stack to sell it, and leaving any one out makes it read as a
   green terminal rather than as a monitor:
     the bezel, so the screen has an edge that is not the viewport
     barrel bulge at the corners, from a radial inset shadow
     an aperture grille at a pitch that DIVIDES the line-height exactly, or it
       moires against the text
     phosphor bloom, which is a blurred duplicate under plus-lighter

   Everything steps. Nothing on this page eases.
   ========================================================================= */
:root{
  --p:#8bffc4;                    /* phosphor */
  --p-dim:color-mix(in srgb,var(--p) 46%,transparent);
  --p-faint:color-mix(in srgb,var(--p) 15%,transparent);
  --amber:#ffcf6b;
  --screen:#050c08;
  --case:#1a1a1c;
  --mono:ui-monospace,"Cascadia Mono","Segoe UI Mono",Consolas,monospace;
  --lh:19px;                      /* the grille pitch divides this exactly */
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:#0a0a0c;color:var(--p);
  font:13px/var(--lh) var(--mono);
  height:100vh;height:100dvh;overflow:hidden;
  padding:2.4dvh 2vw 4dvh;
}
button,input,select{font:inherit;color:inherit;background:none;border:0}
button{cursor:pointer}
:focus-visible{outline:1px solid var(--amber);outline-offset:2px}

/* The enclosure. */
.tube{
  position:relative;height:100%;border-radius:22px;
  background:var(--case);padding:16px 16px 30px;
  box-shadow:
    inset 0 1px 0 #ffffff14,
    inset 0 -2px 6px #00000090,
    0 30px 70px -30px #000;
}
.tube::after{     /* the moulded chin, with a power dot */
  content:'';position:absolute;left:50%;bottom:11px;width:7px;height:7px;border-radius:50%;
  transform:translateX(-50%);background:var(--p);box-shadow:0 0 10px var(--p);
}
.screen{
  position:relative;height:100%;border-radius:14px;overflow:hidden;
  background:
    radial-gradient(120% 120% at 50% 50%,#0a1a12 0%,var(--screen) 62%,#02060400 100%),
    var(--screen);
  /* Barrel bulge: a heavy radial inset that darkens the corners only. */
  box-shadow:inset 0 0 120px 40px #000a, inset 0 0 30px 6px #0006;
}
/* Aperture grille. 3px pitch divides 19px line-height closely enough that the
   text does not swim; a non-dividing pitch is what causes the moire. */
.screen::before{
  content:'';position:absolute;inset:0;z-index:6;pointer-events:none;
  background:
    repeating-linear-gradient(0deg,#0000 0 2px,#0006 2px 3px),
    repeating-linear-gradient(90deg,#ff000010 0 1px,#00ff0010 1px 2px,#0000ff10 2px 3px);
}
/* Rolling interference bar. */
.screen::after{
  content:'';position:absolute;left:0;right:0;height:120px;z-index:7;pointer-events:none;
  background:linear-gradient(#0000,#8bffc40f 40%,#8bffc417 50%,#0000);
}
@media (prefers-reduced-motion:no-preference){
  .screen::after{animation:roll 7.5s linear infinite}
  @keyframes roll{from{top:-140px}to{top:100%}}
}

.crt{position:relative;z-index:2;height:100%;display:grid;
  grid-template-rows:auto auto 1fr;padding:16px 20px;overflow:hidden;
  text-shadow:0 0 5px var(--p-dim), 0 0 14px color-mix(in srgb,var(--p) 22%,transparent)}

.top{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;
  border-bottom:1px solid var(--p-faint);padding-bottom:8px}
.top h1{margin:0;font-size:15px;font-weight:400;letter-spacing:.34em;text-transform:uppercase}
.top .rd{margin-left:auto;display:flex;gap:16px;font-size:11px;letter-spacing:.12em;color:var(--p-dim)}
.top .rd b{color:var(--p);font-weight:400}

.tabs{display:flex;flex-wrap:wrap;gap:0;padding:6px 0;border-bottom:1px solid var(--p-faint)}
.tabs .tab{padding:2px 10px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--p-dim)}
.tabs .tab:hover{color:var(--p)}
.tabs .tab[aria-selected="true"]{background:var(--p);color:var(--screen)}

.body{display:grid;grid-template-columns:1fr 300px;gap:0;min-height:0;overflow:hidden}
.feed{overflow:auto;padding:10px 14px 10px 0}
.dock{border-left:1px solid var(--p-faint);padding:10px 0 10px 14px;overflow:auto}
.dock h3{margin:0 0 6px;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--p-dim);font-weight:400}
.dock section{margin-bottom:16px}

.ln{
  position:relative;display:grid;grid-template-columns:44px 1fr auto;gap:10px;
  align-items:baseline;padding:0 6px;
}
.ln:hover,.ln.on{background:var(--p);color:var(--screen);text-shadow:none}
.ln:hover .n,.ln.on .n{color:var(--screen)}
.n{color:var(--p-dim);font-size:11px}
.t{overflow-wrap:anywhere}
.ln .plus{width:17px;height:17px;line-height:15px;text-align:center;border:1px solid currentColor;font-size:10px}
.ln .plus.in{background:var(--amber);border-color:var(--amber);color:var(--screen)}
.ln .plan-tag{font-size:9px;letter-spacing:.1em;opacity:.6}
.hdr{margin:12px 0 4px;color:var(--amber);font-size:11px;letter-spacing:.22em;text-transform:uppercase}
.cursor{display:inline-block;width:8px;height:13px;background:var(--p);vertical-align:-2px}
@media (prefers-reduced-motion:no-preference){
  .cursor{animation:blk 1.06s steps(1) infinite}
  @keyframes blk{50%{opacity:0}}
}
#setup .os,#filters .chip{border:1px solid var(--p-faint);padding:2px 7px;font-size:11px;color:var(--p-dim)}
#setup .os.on,#filters .chip.on{background:var(--p);color:var(--screen);border-color:var(--p)}
#setup input{border:1px solid var(--p-faint);width:58px;padding:2px 5px;color:var(--p)}
#setup .num{display:none}
.pane{font-size:12px}
*{transition-duration:60ms;transition-timing-function:steps(3,end)}

@media (max-width:900px){
  .body{grid-template-columns:1fr}
  .dock{border-left:0;border-top:1px solid var(--p-faint);padding:10px 0 0}
}

.otheros{margin-top:10px;border:1px solid var(--p-faint);padding:8px 10px}
.otheros summary{cursor:pointer;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--p-dim);list-style:none}
.otheros summary::-webkit-details-marker{display:none}
.otheros summary::before{content:"[+] ";color:var(--amber)}
.otheros[open] summary::before{content:"[-] "}
</style>
<link rel="stylesheet" href="atlas-exhibition.css">
</head>
<body>
<script src="atlas-theme.js"></script>
<script src="atlas-data.js"></script>
<script src="atlas-core.js"></script>
<script src="atlas-panes.js"></script>
<script>
'use strict';
const A = AtlasCore, P = AtlasPanes, esc = P.esc;

document.body.insertAdjacentHTML('beforeend', `
<div class="tube"><div class="screen"><div class="crt">
  <header class="top">
    <h1>Tube</h1>
    <div class="rd"><span>SIG <b data-visible-count>0</b></span><span>BUF <b data-basket-count>0</b></span></div>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Tube channels"></nav>
  <div class="body">
    <main class="feed" id="main-content"><div id="stage" tabindex="-1"></div></main>
    <aside class="dock">
      <section><h3>Signal</h3><div id="themehost"></div></section>
      <section><h3>Machine</h3><div id="setup"></div></section>
      <section><h3>Filter</h3><div id="filters"></div></section>
      <section><h3>Detail</h3><div id="side" aria-label="Component inspector"></div></section>
    </aside>
  </div>
</div></div></div>`);

function render(stage){
  const groups = new Map();
  A.visibleComponents().forEach(c => {
    if(!groups.has(c.family)) groups.set(c.family, []);
    groups.get(c.family).push(c);
  });
  if(!groups.size){ stage.innerHTML = '<p>NO SIGNAL<span class="cursor"></span></p>'; return; }
  const famName = id => (A.state.data.families.find(f => f.id === id) || {name:id}).name;
  let n = 0;
  stage.innerHTML = [...groups.entries()].map(([fam, items]) => {
    const shown = items.slice(0, 40);
    return `<p class="hdr">&gt; ${esc(famName(fam))} [${items.length}]</p>` + shown.map(c => {
      n += 1;
      return `<div class="ln${A.state.selected === c.id ? ' on' : ''}" data-node="1" data-comp="${esc(c.id)}">
        <span class="n">${String(n).padStart(4,'0')}</span><span class="t">${esc(c.name)}</span>${add(c)}
      </div>`;
    }).join('');
  }).join('') + '<p><span class="cursor"></span></p>';
  wire(stage);
  counts();
}

function add(c){
  if(!A.canBuild(c)){
    const s = A.setupStateFor(c);
    return `<span class="plan-tag">${esc(s.id === 'choose-platform' ? 'NO OS' : s.id === 'review-required' ? 'RVW' : s.id === 'hosted' ? 'HOST' : '----')}</span>`;
  }
  const inB = A.state.basket.includes(c.id);
  return `<button class="plus${inB ? ' in' : ''}" data-add="${esc(c.id)}" aria-label="${inB?'Remove':'Add'} ${esc(c.name)}">${inB ? '*' : '+'}</button>`;
}

function wire(stage){
  stage.querySelectorAll('[data-node]').forEach(n => {
    n.addEventListener('click', e => {
      if(e.target.closest('[data-add]')) return;
      A.select(n.dataset.comp);
      P.popover(e.clientX, e.clientY, n.dataset.comp);
      stage.querySelectorAll('.ln.on').forEach(a => a.classList.remove('on'));
      n.classList.add('on');
    });
  });
  stage.querySelectorAll('[data-add]').forEach(b => {
    b.addEventListener('click', e => {
      e.stopPropagation();
      const id = b.dataset.add;
      if(A.state.basket.includes(id)) A.removeFromBasket(id); else A.addToBasket(id);
      P.draw(); counts();
    });
  });
}

function counts(){
  const c = A.counts();
  document.querySelectorAll('[data-basket-count]').forEach(n => n.textContent = String(c.basket).padStart(3,'0'));
  document.querySelectorAll('[data-visible-count]').forEach(n => n.textContent = String(c.visibleComponents).padStart(4,'0'));
}

AtlasTheme.mount(document.getElementById('themehost'), 'ember');
P.mount({
  renderMap: render,
  onFilter: () => { if(P.tab === 'map') render(document.getElementById('stage')); counts(); },
  onSelect: counts,
});
A.on(counts);
</script>
<script src="atlas-exhibition.js"></script>
<script>AtlasExhibition.mount('tube');</script>
</body>
</html>
