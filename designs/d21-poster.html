<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A Swiss grotesque poster on a rigid six by eight grid, with no depth of any kind.">
<title>Poster | Master Repo</title>
<link rel="stylesheet" href="themes.css">
<style>
/* ===========================================================================
   POSTER. It is a poster, not an application. The headline is the largest
   object on screen by a wide margin, flush left on a rigid 6 x 8 grid.

   Absolutely no depth. No shadow, no blur, no gradient, no transparency except
   one duotone. That refusal is the entire identity: every other dark page in
   the set is doing something with light, and this one flatly is not.

   The asymmetry is extreme and deliberate. The headline claims a quarter of the
   grid and the content is pushed into the remainder, which is what separates a
   Swiss poster from a centred hero.
   ========================================================================= */
:root{
  --paper:#f2f0eb; --ps-ink:#12100e; --red:#e03616; --blue:#1c39bb;
  --grid:color-mix(in srgb,var(--ps-ink) 12%,var(--paper));
  --sans:"Helvetica Neue",Helvetica,Arial,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
}
*{box-sizing:border-box;border-radius:0}
html,body{margin:0;height:100%}
body{
  background:var(--paper);color:var(--ps-ink);
  font:14px/1.35 var(--sans);-webkit-font-smoothing:antialiased;
  height:100vh;height:100dvh;overflow:hidden;
}
button,input,select{font:inherit;color:inherit;background:none;border:0}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}

.sheet{
  height:100vh;height:100dvh;display:grid;
  grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(8,1fr);
  gap:0;padding:40px;overflow:hidden;
}
/* The 8px baseline rhythm, visible. In a Swiss poster the grid is not a
   scaffold you hide, it is part of the composition. */
.sheet::before{
  content:'';position:fixed;inset:40px;pointer-events:none;z-index:0;
  background:repeating-linear-gradient(0deg,transparent 0 39px,var(--grid) 39px 40px);
}
.sheet > *{position:relative;z-index:1;min-width:0;min-height:0}

.head{grid-column:1/5;grid-row:1/4;display:flex;flex-direction:column;justify-content:flex-start}
.kicker{font:700 11px/1 var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--red);margin-bottom:14px}
h1{
  margin:0;font-size:clamp(52px,10.5vw,164px);line-height:.82;letter-spacing:-.045em;
  font-weight:700;text-wrap:balance;
}
h1 em{font-style:normal;color:var(--red)}
.lede{margin:20px 0 0;max-width:34ch;font-size:16px;line-height:1.4;color:color-mix(in srgb,var(--ps-ink) 72%,var(--paper))}

.figures{grid-column:5/7;grid-row:1/4;display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-end;text-align:right;gap:18px;padding-top:4px}
.fig b{display:block;font-size:clamp(34px,4.6vw,66px);line-height:.86;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.fig span{font:700 10px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase}
.fig.r b{color:var(--red)}
.fig.b b{color:var(--blue)}

.rule{grid-column:1/7;grid-row:4/5;border-top:6px solid var(--ps-ink);align-self:start}

.nav{grid-column:1/3;grid-row:4/9;padding-top:16px;overflow:auto}
.nav .tabs{display:flex;flex-direction:column;align-items:flex-start;gap:1px}
.nav .tab{
  font:700 12px/1 var(--sans);letter-spacing:.02em;text-transform:uppercase;
  padding:6px 0;border-bottom:1px solid transparent;color:var(--ps-ink);
}
.nav .tab:hover{border-bottom-color:var(--ps-ink)}
.nav .tab[aria-selected="true"]{color:var(--red);border-bottom-color:var(--red)}
.nav h2{margin:22px 0 8px;font:700 10px/1 var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--red)}

.body{grid-column:3/7;grid-row:4/9;padding:16px 0 0 30px;border-left:1px solid var(--ps-ink);overflow:auto}
.list{columns:2 260px;column-gap:30px}
.item{
  break-inside:avoid;position:relative;padding:9px 0 9px 0;border-bottom:1px solid var(--ps-ink);
  display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:baseline;
}
.item:hover,.item.on{background:var(--ps-ink);color:var(--paper)}
.item:hover .idx,.item.on .idx{color:var(--paper)}
.idx{font:700 10px/1.6 var(--mono);letter-spacing:.06em;color:var(--red)}
.nm{font-size:13.5px;font-weight:500;overflow-wrap:anywhere}
.item .plus{width:19px;height:19px;border:1.5px solid currentColor;font:700 11px/16px var(--mono);text-align:center}
.item .plus.in{background:var(--red);border-color:var(--red);color:var(--paper)}
.item .plan-tag{font:700 9px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;opacity:.55}
.grp{break-inside:avoid;margin:16px 0 6px;font:700 11px/1 var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--blue)}
.grp:first-child{margin-top:0}

#setup,#filters,#side{font-size:12.5px}
#setup .os,#filters .chip{border:1px solid var(--ps-ink);padding:3px 8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
#setup .os.on,#filters .chip.on{background:var(--red);border-color:var(--red);color:var(--paper)}
#setup input{border:1px solid var(--ps-ink);padding:3px 6px;width:56px}
#setup .num{display:none}
.pane{font-size:13px}

/* Entry only: a wipe. Nothing on this page has an idle animation. */
@media (prefers-reduced-motion:no-preference){
  .head,.figures,.nav,.body{animation:wipe 620ms cubic-bezier(.16,1,.3,1) both}
  .figures{animation-delay:60ms}.nav{animation-delay:120ms}.body{animation-delay:180ms}
  @keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
}
@media (max-width:960px){
  .sheet{grid-template-columns:1fr;grid-template-rows:auto auto auto 1fr;padding:22px}
  .head,.figures,.rule,.nav,.body{grid-column:1;grid-row:auto}
  .figures{align-items:flex-start;text-align:left;flex-direction:row;flex-wrap:wrap;gap:24px}
  .body{border-left:0;padding-left:0}
  .list{columns:1}
}
</style>
</head>
<body>
<script src="atlas-theme.js"></script>
<script src="atlas-data.js"></script>
<script src="atlas-core.js"></script>
<script src="atlas-panes.js"></script>
<script>
'use strict';
const A = AtlasCore, P = AtlasPanes, esc = P.esc;

document.body.insertAdjacentHTML('beforeend', `
<div class="sheet">
  <header class="head">
    <p class="kicker">Master Repo</p>
    <h1>One<br>catalogue.<br><em>Every</em> path.</h1>
    <p class="lede">Nine hundred and seventy reviewed parts, one grid, and no depth anywhere on the page.</p>
  </header>
  <div class="figures">
    <div class="fig r"><b data-visible-count>0</b><span>Visible</span></div>
    <div class="fig b"><b data-basket-count>0</b><span>In build</span></div>
    <div id="themehost"></div>
  </div>
  <div class="rule"></div>
  <nav class="nav">
    <div class="tabs" id="tabs" role="tablist" aria-label="Poster sections"></div>
    <h2>Machine</h2><div id="setup"></div>
    <h2>Selection</h2><div id="filters"></div>
    <h2>Detail</h2><div id="side" aria-label="Component inspector"></div>
  </nav>
  <main class="body" id="main-content"><div id="stage" tabindex="-1"></div></main>
</div>`);

function render(stage){
  const groups = new Map();
  A.visibleComponents().forEach(c => {
    if(!groups.has(c.family)) groups.set(c.family, []);
    groups.get(c.family).push(c);
  });
  if(!groups.size){ stage.innerHTML = '<p>Nothing matches this selection.</p>'; return; }
  const famName = id => (A.state.data.families.find(f => f.id === id) || {name:id}).name;
  let n = 0;
  stage.innerHTML = `<div class="list">${[...groups.entries()].map(([fam, items]) => {
    const shown = items.slice(0, 24);
    return `<p class="grp">${esc(famName(fam))} / ${items.length}</p>` + shown.map(c => {
      n += 1;
      return `<article class="item${A.state.selected === c.id ? ' on' : ''}" data-node="1" data-comp="${esc(c.id)}">
        <span class="idx">${String(n).padStart(3,'0')}</span><span class="nm">${esc(c.name)}</span>${add(c)}
      </article>`;
    }).join('');
  }).join('')}</div>`;
  wire(stage);
  counts();
}

function add(c){
  if(!A.canBuild(c)){
    const s = A.setupStateFor(c);
    return `<span class="plan-tag">${esc(s.id === 'choose-platform' ? 'OS' : s.id === 'review-required' ? 'RVW' : s.id === 'hosted' ? 'HST' : 'NIL')}</span>`;
  }
  const inB = A.state.basket.includes(c.id);
  return `<button class="plus${inB ? ' in' : ''}" data-add="${esc(c.id)}" aria-label="${inB?'Remove':'Add'} ${esc(c.name)}">${inB ? '×' : '+'}</button>`;
}

function wire(stage){
  stage.querySelectorAll('[data-node]').forEach(n => {
    n.addEventListener('click', e => {
      if(e.target.closest('[data-add]')) return;
      A.select(n.dataset.comp);
      P.popover(e.clientX, e.clientY, n.dataset.comp);
      stage.querySelectorAll('.item.on').forEach(a => a.classList.remove('on'));
      n.classList.add('on');
    });
  });
  stage.querySelectorAll('[data-add]').forEach(b => {
    b.addEventListener('click', e => {
      e.stopPropagation();
      const id = b.dataset.add;
      if(A.state.basket.includes(id)) A.removeFromBasket(id); else A.addToBasket(id);
      P.draw(); counts();
    });
  });
}

function counts(){
  const c = A.counts();
  document.querySelectorAll('[data-basket-count]').forEach(n => n.textContent = c.basket);
  document.querySelectorAll('[data-visible-count]').forEach(n => n.textContent = c.visibleComponents);
}

AtlasTheme.mount(document.getElementById('themehost'), 'ember');
P.mount({
  renderMap: render,
  onFilter: () => { if(P.tab === 'map') render(document.getElementById('stage')); counts(); },
  onSelect: counts,
});
A.on(counts);
</script>
</body>
</html>
