<svg class="dg" viewBox="0 0 1000 590" role="img" aria-label="Four zones left to right: your machine, an untrusted zone, the human gate, and the trusted registry. Client metadata and upstream changes enter the untrusted zone through intake, quarantine and scanners; evidence goes to a review issue you approve; only the publisher writes records to Postgres and archives to object storage; clients pull the signed index and packages back along one rail and verify before installing.">
          <defs>
            <marker id="f2a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0 L10 5 L0 10 z"/></marker>
          </defs>

          <!-- zones -->
          <rect class="zone" x="10" y="16" width="190" height="530" rx="10"/>
          <text class="zlabel" x="24" y="38">YOUR MACHINE</text>
          <rect class="zone untrusted" x="215" y="16" width="250" height="530" rx="10"/>
          <text class="zlabel" x="229" y="38">UNTRUSTED, NO SECRETS</text>
          <rect class="zone" x="480" y="16" width="150" height="530" rx="10"/>
          <text class="zlabel" x="494" y="38">HUMAN GATE</text>
          <rect class="zone" x="645" y="16" width="345" height="530" rx="10"/>
          <text class="zlabel" x="659" y="38">TRUSTED REGISTRY</text>

          <!-- untrusted column -->
          <rect class="box" x="235" y="60" width="210" height="48" rx="6"/>
          <text class="t" x="247" y="81">Upstream repos</text><text class="s" x="247" y="97">commits, releases, advisories</text>
          <rect class="box" x="235" y="140" width="210" height="48" rx="6"/>
          <text class="t" x="247" y="161">Watcher</text><text class="s" x="247" y="177">polls with ETag, pins sha256</text>
          <rect class="box" x="235" y="220" width="210" height="48" rx="6"/>
          <text class="t" x="247" y="241">Intake API</text><text class="s" x="247" y="257">auth, size and time limits</text>
          <rect class="box" x="235" y="300" width="210" height="48" rx="6"/>
          <text class="t" x="247" y="321">Quarantine</text><text class="s" x="247" y="337">private bucket, never the repo</text>
          <rect class="box" x="235" y="380" width="210" height="48" rx="6"/>
          <text class="t" x="247" y="401">Scanners</text><text class="s" x="247" y="417">sandboxed, evidence only</text>

          <line class="edge" x1="340" y1="108" x2="340" y2="138" marker-end="url(#f2a)"/>
          <text class="lbl" x="348" y="127">new digest</text>
          <line class="edge" x1="340" y1="188" x2="340" y2="218" marker-end="url(#f2a)"/>
          <text class="lbl" x="348" y="207">candidate</text>
          <line class="edge" x1="340" y1="268" x2="340" y2="298" marker-end="url(#f2a)"/>
          <text class="lbl" x="348" y="287">exact commit</text>
          <line class="edge" x1="340" y1="348" x2="340" y2="378" marker-end="url(#f2a)"/>
          <text class="lbl" x="348" y="367">bytes</text>

          <!-- your machine -->
          <rect class="box" x="30" y="220" width="150" height="48" rx="6"/>
          <text class="t" x="42" y="241">Client agent</text><text class="s" x="42" y="257">opt-in, runs locally</text>
          <rect class="box" x="30" y="380" width="150" height="48" rx="6"/>
          <text class="t" x="42" y="401">Harness adapters</text><text class="s" x="42" y="417">Claude, Codex, Copilot</text>
          <rect class="box" x="30" y="460" width="150" height="48" rx="6"/>
          <text class="t" x="42" y="481">Local cache</text><text class="s" x="42" y="497">lockfile, verified bytes</text>

          <line class="edge" x1="180" y1="244" x2="233" y2="244" marker-end="url(#f2a)"/>
          <text class="lbl" x="207" y="236" text-anchor="middle">metadata</text>
          <line class="edge" x1="105" y1="380" x2="105" y2="270" marker-end="url(#f2a)"/>
          <text class="lbl" x="113" y="329">reads configs</text>
          <line class="edge" x1="105" y1="460" x2="105" y2="430" marker-end="url(#f2a)"/>
          <text class="lbl" x="113" y="449">installs</text>

          <!-- human gate -->
          <rect class="box gate" x="495" y="373" width="120" height="62" rx="6"/>
          <text class="t gate" x="507" y="394">Review issue</text>
          <text class="s" x="507" y="410">you approve the</text>
          <text class="s" x="507" y="424">exact digest</text>
          <line class="edge" x1="445" y1="404" x2="493" y2="404" marker-end="url(#f2a)"/>
          <text class="lbl" x="470" y="396" text-anchor="middle">evidence</text>
          <path class="edge dashed" d="M445 164 L555 164 L555 371" marker-end="url(#f2a)"/>
          <text class="lbl" x="563" y="262">stale or</text>
          <text class="lbl" x="563" y="276">archived</text>

          <!-- trusted registry -->
          <rect class="box" x="660" y="380" width="112" height="48" rx="6"/>
          <text class="t" x="672" y="401">Publisher</text><text class="s" x="672" y="417">signs, writes once</text>
          <rect class="box" x="660" y="460" width="112" height="48" rx="6"/>
          <text class="t" x="672" y="481">Git</text><text class="s" x="672" y="497">what you author</text>
          <rect class="box" x="815" y="220" width="160" height="48" rx="6"/>
          <text class="t" x="827" y="241">Postgres</text><text class="s" x="827" y="257">metadata, lifecycle state</text>
          <rect class="box" x="815" y="300" width="160" height="48" rx="6"/>
          <text class="t" x="827" y="321">Signed index</text><text class="s" x="827" y="337">current and revoked</text>
          <rect class="box" x="815" y="380" width="160" height="48" rx="6"/>
          <text class="t" x="827" y="401">Object storage</text><text class="s" x="827" y="417">bytes keyed by sha256</text>

          <line class="edge" x1="615" y1="404" x2="658" y2="404" marker-end="url(#f2a)"/>
          <text class="lbl" x="637" y="396" text-anchor="middle">approved</text>
          <line class="edge" x1="716" y1="460" x2="716" y2="430" marker-end="url(#f2a)"/>
          <text class="lbl" x="724" y="449">builds from</text>
          <line class="edge" x1="772" y1="404" x2="813" y2="404" marker-end="url(#f2a)"/>
          <text class="lbl" x="793" y="396" text-anchor="middle">archive</text>
          <path class="edge" d="M716 380 L716 244 L813 244" marker-end="url(#f2a)"/>
          <text class="lbl" x="765" y="236" text-anchor="middle">record, tombstone</text>
          <line class="edge" x1="895" y1="268" x2="895" y2="298" marker-end="url(#f2a)"/>
          <text class="lbl" x="903" y="287">publishes</text>

          <!-- the pull rail back to the user's machine -->
          <path class="edge" d="M975 324 L983 324 L983 566 L105 566 L105 510" marker-end="url(#f2a)"/>
          <line class="edge" x1="895" y1="428" x2="895" y2="566"/>
          <text class="lbl" x="540" y="558" text-anchor="middle">clients pull the index and packages, then verify the signature</text>
        </svg>
